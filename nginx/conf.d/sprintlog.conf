# SprintLog 앞단 — Nginx 가 HTTPS 를 맡고(SSL 종단), 앱에는 평범한 HTTP 로 넘긴다.
#   인증서는 mkcert 로 만든 certs/ 를 그대로 빌려 쓴다(compose 의 volumes).

# ① 80(HTTP)으로 오면 → 같은 주소의 443(HTTPS)으로 보낸다
server {
    listen 80;
    server_name localhost;

    return 301 https://$host$request_uri;
}

# ② 443(HTTPS) — 여기서 자물쇠를 푼다
server {
    listen 443 ssl;
    http2 on;                       # 브라우저와는 HTTP/2 로(브라우저는 HTTP/2 를 HTTPS 위에서만 쓴다)
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.pem;       # 인증서
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;   # 그 짝인 개인키
    ssl_protocols       TLSv1.2 TLSv1.3;                      # 지금 Nginx 기본값과 같다 — 의도를 드러내려 적는다

    location / {
        # compose 네트워크 안에서 앱 컨테이너를 서비스 이름(app)으로 찾는다 — 평범한 HTTP
        proxy_pass http://app:8080;

        # 앱이 "원래 요청" 을 알 수 있게 — 어느 주소로·누가·http 였나 https 였나(자세히는 다음 토픽)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
